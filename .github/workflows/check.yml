# The gate a contribution must pass, run on every push and pull request.
#
# `npm run check` was the documented gate and nothing ran it — there was no
# `.github/` directory at all, so the only enforcement was somebody remembering.
#
# This workflow needs NO secrets, and that is a property worth keeping rather
# than an accident. It was verified rather than assumed: the tests that need
# `HARBOR_ENCRYPTION_KEY` set it themselves at module scope, `AUTH_SECRET` is only
# fatal under `NODE_ENV=production`, and no sandbox provider reads a credential at
# construction time — every vendor client is built on first call. So a fork's pull
# request runs the full suite with no configuration, which is exactly what an
# open-source contribution needs.

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: harbor
          POSTGRES_DB: harbor
        # Published on 5433, not 5432, and that is what makes this job
        # zero-configuration: `core/schema/index.ts` and `vitest.config.ts` both
        # default to postgres://harbor:harbor@localhost:5433/harbor, so no
        # DATABASE_URL needs to be set anywhere in this file.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The five structural checks, run before the database is touched because they
      # need no database and finish in under a second — a licence header or a zone
      # boundary that is wrong should come back in ten seconds, not after the suite.
      #
      # This is the same `npm run check:structure` that `npm run check` runs below,
      # named as its own step only so the red X in the Actions UI says WHICH property
      # broke. It is not a second source of truth: the list of checks lives in
      # package.json, so local and CI cannot drift apart. The five, and the failure
      # each one prevents:
      #
      #   check:spdx          a file that does not say which of the two licences it
      #                       carries, so core/ cannot be extracted with confidence
      #   check:boundaries    an import out of core/, or from app/ into pilot/, which
      #                       nothing else in the build notices
      #   check:license-leak  FSL text under core/, contradicting the Apache grant
      #   check:write-path    a claims write outside core/kernel/, leaving the table
      #                       right and every projection derived from it wrong
      #   check:migrations    a destructive migration, run unattended against a
      #                       self-hoster's database on boot
      #
      # They are blocking on purpose. These run against agent fleets where no human
      # reads the diff, so a warning is a thing nobody sees.
      - name: Structure (licences, boundaries, write path, migrations)
        run: npm run check:structure

      # Mandatory and easy to miss: `vitest.setup.ts` takes the advisory lock and
      # truncates between cases, but nothing in the suite applies migrations.
      # Without this step every database-backed test fails on a missing table.
      - name: Apply migrations
        run: npm run db:migrate

      # lint:config (no hardcoded tunables) + the five structural checks + tsc + the
      # full suite. `npm run check` is the documented gate and it is what runs here,
      # so the command a contributor runs locally is the command that decides the
      # pull request.
      - name: Check
        run: npm run check

      # Not part of `check`, and needs to be here: `next build` is the only thing
      # that exercises webpack over the provider registry, which statically
      # imports thirteen providers including two vendor SDKs that resolve modules
      # by computed expression. A tree can typecheck and test green and still
      # fail to build.
      - name: Build
        run: npm run build

      # Proves the image is assembled correctly — that `npm ci --omit=dev` did not
      # prune something the runtime needs and that every provider module loads.
      # No credentials, no network, no database.
      - name: Doctor
        run: npx tsx scripts/doctor.ts
        env:
          HARBOR_PUBLIC_URL: https://harbor.invalid
